
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-show">
        <div class="slides">
            <img src="./img/sale4.jpg" alt="Banner 1">
            <img src="./img/cat6.webp" alt="Banner 2">
            <img src="./img/cat7.webp" alt="Banner 3">
        </div>

        <button class="prev" aria-label="Ảnh trước">&#10094;</button>
        <button class="next" aria-label="Ảnh tiếp">&#10095;</button>

        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
