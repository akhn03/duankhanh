<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Header Shopee</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header class="header">
    <div class="top-bar">
        <div class="left">
            <a href="#">Kênh Người Bán</a>
            <span>|</span>

            <span>|</span>
            <a href="#">Tải ứng dụng</a>
        </div>

        <div class="right">
            <a href="#">Thông Báo</a>
            <a href="#">Hỗ Trợ</a>
            <a href="#">Tiếng Việt ▼</a>
            <a href="#">Đăng Ký</a>
            <span>|</span>
            <a href="#">Đăng Nhập</a>
        </div>
    </div>

    <div class="main-header">

        <div class="logo">
            <img src="./img/logo-shopee-vectordohoa.com-3-01.jpg" alt="Shopee">
        </div>

        <div class="search-box">
            <div class="search">
                <input type="text"
                       placeholder="Shopee bao ship 0Đ - Đăng ký ngay!">
                <button>🔍</button>
            </div>

            <div class="keywords">
                <a href="#">Áo Kiểu Nữ</a>
                <a href="#">Golden Goose</a>
                <a href="#">Máy Đạp Phòng</a>
                <a href="#">Chân Tóc</a>

        </div>

        <div class="cart">
            🛒
        </div>

    </div>

</html>
