<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopee Header</title>

    <link rel="stylesheet" href="index.css">

    <!-- Font Awesome để dùng icon -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header class="header">

    <div class="top-header">

        <div class="top-container">

            <div class="top-left">
                <a href="#">Kênh Người Bán</a>
                <span>|</span>

                <a href="#">Trở thành Người bán Shopee</a>
                <span>|</span>

                <a href="#">Tải ứng dụng</a>
                <span>|</span>

                <a href="#">Kết nối</a>

                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>


            <div class="top-right">

                <a href="#">
                    <i class="fa-regular fa-bell"></i>
                    Thông Báo
                </a>

                <a href="#">
                    <i class="fa-regular fa-circle-question"></i>
                    Hỗ Trợ
                </a>

                <a href="#">
                    <i class="fa-solid fa-globe"></i>
                    Tiếng Việt
                    <i class="fa-solid fa-chevron-down arrow"></i>
                </a>

                <a href="#">Đăng Ký</a>

                <span>|</span>

                <a href="#">Đăng Nhập</a>

            </div>

        </div>

    </div>


    <div class="main-header">

        <div class="main-container">


            <div class="logo">

                <div class="logo-icon">
                    S
                </div>

                <span>Shopee</span>

            </div>

            <div class="search-area">

                <div class="search-box">

                    <input
                        type="text"
                        placeholder="Shopee bao ship 0Đ - Đăng ký ngay!"
                    >

                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                </div>


                <div class="keywords">

                    <a href="#">Áo Kiểu Nữ</a>
                    <a href="#">Golden Goose</a>
                    <a href="#">Máy Đập Phồng Chân</a>
                    <a href="#">Tóc Chân Vương</a>
                    <a href="#">Áo Khoác Adidas</a>
                    <a href="#">Gương Toàn Thân Chống Vỡ</a>
                    <a href="#">Quần</a>

                </div>

            </div>


            <!-- GIỎ HÀNG -->
            <div class="cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-number">0</span>

            </div>


        </div>

    </div>

</header>

</body>
</html>
